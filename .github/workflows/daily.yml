name: Daily sync and report

on:
  schedule:
    # Every 30 minutes. The script decides per user whether a report is due, using each
    # user's own local send time (make settings), so no time zone is hard-coded here.
    # GitHub may start scheduled runs a few minutes late.
    - cron: "7,37 * * * *"
  workflow_dispatch: {}   # "Run workflow" button: sends the report immediately

permissions:
  contents: read

concurrency:
  group: daily-report
  cancel-in-progress: false   # never run two syncs at once (WHOOP rotates refresh tokens)

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --locked
      - name: Sync data and email the report
        run: uv run python scripts/daily.py ${{ github.event_name == 'workflow_dispatch' && '--now' || '' }}
        env:
          TOKEN_STORE: db
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
          GOOGLE_CALENDAR_IDS: primary
          REPORT_TIMEZONE: America/Los_Angeles
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          ACTION_SIGNING_KEY: ${{ secrets.ACTION_SIGNING_KEY }}
