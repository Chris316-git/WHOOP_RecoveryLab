name: Daily sync and report

on:
  schedule:
    # Fallback every 30 minutes. Normally the run is started by the WHOOP webhook as soon as
    # last night's sleep is scored (src/api/webhooks.py). The script decides per user whether
    # a report is due, in each user's own time zone. GitHub may start scheduled runs late.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      trigger:
        description: "manual: send now; whoop: started by the webhook (send only if due)"
        default: manual

permissions:
  contents: read

concurrency:
  group: daily-report
  cancel-in-progress: false   # never run two syncs at once (WHOOP rotates refresh tokens)

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --locked
      - name: Sync data and email the report
        run: uv run python scripts/daily.py ${{ (github.event_name == 'workflow_dispatch' && inputs.trigger != 'whoop') && '--now' || '' }}
        env:
          TOKEN_STORE: db
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
          GOOGLE_CALENDAR_IDS: primary
          REPORT_TIMEZONE: America/Los_Angeles
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          ACTION_SIGNING_KEY: ${{ secrets.ACTION_SIGNING_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
