name: Tests

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uvx ruff check --target-version py311 --select E,F,W,I --line-length 120 src scripts tests
      - name: Tests (including the SQLite and API tests)
        run: uv run pytest -q
