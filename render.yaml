# Render blueprint for the endpoint behind the email links (Add to calendar, Change time, Dismiss, Undo).
# In Render: New > Blueprint > connect this repository, then fill in the secret values.
# The free plan sleeps when idle, so the first click after a while can take ~30-60 seconds.
services:
  - type: web
    name: recovery-lab
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: .venv/bin/uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TOKEN_STORE
        value: db
      - key: REPORT_TIMEZONE
        value: America/Los_Angeles
      - key: DATABASE_URL
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: ACTION_SIGNING_KEY
        sync: false
      # WHOOP webhook -> start the daily workflow right after last night is scored (README: Instant delivery)
      - key: WHOOP_CLIENT_SECRET
        sync: false
      - key: GITHUB_DISPATCH_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: Chris316-git/WHOOP_RecoveryLab
      # The coach chat (/coach/<link from the email>) calls Claude from here
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional: dense retrieval for the coach's knowledge search (BM25 is used without it)
      - key: VOYAGE_API_KEY
        sync: false
